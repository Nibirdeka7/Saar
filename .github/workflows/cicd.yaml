name: Saar Enterprise AI CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - docs/**

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saar-deployment
  cancel-in-progress: false

jobs:

  # ==========================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================

  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Check Python Syntax
        run: |
          python -m compileall -q app worker scripts

      - name: Run Core Unit Tests
        run: |
          pytest test/test_rag_v2.py -v

  # ==========================================
  # 2. CONTINUOUS DELIVERY - BUILD AND PUSH ECR
  # ==========================================

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -n "$ECR_REGISTRY"
          test -n "$ECR_REPOSITORY"

          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building Docker image..."
          docker build -t "$IMAGE" .

          echo "Pushing image to Amazon ECR..."
          docker push "$IMAGE"

          echo "Docker image pushed successfully"

  # ==========================================
  # 3. CONTINUOUS DEPLOYMENT - EC2
  # ==========================================

  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image

    runs-on: [self-hosted, linux, x64, saar-ec2]
    environment: production

    steps:

      # ----------------------------------------
      # AWS AUTHENTICATION
      # ----------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------
      # CONSTRUCT DOCKER IMAGE URI
      # ----------------------------------------

      - name: Construct ECR Image URI
        id: image
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "ECR image URI constructed successfully: $IMAGE"

      # ----------------------------------------
      # PULL IMAGE
      # ----------------------------------------

      - name: Pull Docker Image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

      # ----------------------------------------
      # VALIDATE APPLICATION SECRETS
      # ----------------------------------------

      - name: Validate Application Secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

          BEDROCK_EMBED_MODEL: ${{ secrets.BEDROCK_EMBED_MODEL }}
          BEDROCK_CHAT_MODEL: ${{ secrets.BEDROCK_CHAT_MODEL }}
          EMBED_DIM: ${{ secrets.EMBED_DIM }}

          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_CLOUD: ${{ secrets.PINECONE_CLOUD }}
          PINECONE_REGION: ${{ secrets.PINECONE_REGION }}
          PINECONE_READY_TIMEOUT: ${{ secrets.PINECONE_READY_TIMEOUT }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          HITL_ENABLED: ${{ secrets.HITL_ENABLED }}
          MEMORY_TURNS: ${{ secrets.MEMORY_TURNS }}

        run: |
          set -euo pipefail

          REQUIRED=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_REGION
            S3_BUCKET
            BEDROCK_EMBED_MODEL
            BEDROCK_CHAT_MODEL
            EMBED_DIM
            PINECONE_API_KEY
            PINECONE_INDEX_NAME
            PINECONE_CLOUD
            PINECONE_REGION
            PINECONE_READY_TIMEOUT
            DATABASE_URL
            HITL_ENABLED
            MEMORY_TURNS
          )

          for name in "${REQUIRED[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing Required Environment Secret: $name"
              exit 1
            fi
          done

          echo "All required core application secrets are available"

      # ----------------------------------------
      # RUN DATABASE SCHEMA INITIALIZATION / MIGRATION
      # ----------------------------------------

      - name: Apply Database Migrations
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Applying database schema migrations (including parent_chunks and users tables)..."
          docker run --rm \
            -e DATABASE_URL \
            "$IMAGE" \
            python scripts/init_db.py

      # ----------------------------------------
      # STOP EXISTING CONTAINER
      # ----------------------------------------

      - name: Stop Old Container
        run: |
          docker rm -f saar-enterprise-ai || true

      # ----------------------------------------
      # START NEW CONTAINER WITH APPLICATION ENVIRONMENT
      # ----------------------------------------

      - name: Start New Container
        env:
          IMAGE: ${{ steps.image.outputs.image }}

          # AWS Core
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}

          # Bedrock RAG Models
          BEDROCK_EMBED_MODEL: ${{ secrets.BEDROCK_EMBED_MODEL }}
          BEDROCK_CHAT_MODEL: ${{ secrets.BEDROCK_CHAT_MODEL }}
          BEDROCK_RERANK_MODEL: ${{ secrets.BEDROCK_RERANK_MODEL || 'cohere.rerank-v3-5:0' }}
          EMBED_DIM: ${{ secrets.EMBED_DIM }}

          # Pinecone
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_CLOUD: ${{ secrets.PINECONE_CLOUD }}
          PINECONE_REGION: ${{ secrets.PINECONE_REGION }}
          PINECONE_READY_TIMEOUT: ${{ secrets.PINECONE_READY_TIMEOUT }}

          # PostgreSQL (Users, Documents, Memory, Approvals, Parent Chunks)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # Authentication & Security
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY || 'production-rag-auth-secret-key-atlas-enterprise-rag-2026' }}
          AUTH_TOKEN_EXPIRE_HOURS: ${{ secrets.AUTH_TOKEN_EXPIRE_HOURS || '24' }}

          # Guardrails & Memory
          HITL_ENABLED: ${{ secrets.HITL_ENABLED }}
          MEMORY_TURNS: ${{ secrets.MEMORY_TURNS }}

          # Advanced RAG v2 Parameters (Parent-Child, BM25, Reranking, Budgets)
          PARENT_CHUNK_SIZE: ${{ secrets.PARENT_CHUNK_SIZE || '1800' }}
          PARENT_CHUNK_OVERLAP: ${{ secrets.PARENT_CHUNK_OVERLAP || '200' }}
          CHILD_CHUNK_SIZE: ${{ secrets.CHILD_CHUNK_SIZE || '400' }}
          CHILD_CHUNK_OVERLAP: ${{ secrets.CHILD_CHUNK_OVERLAP || '60' }}
          VECTOR_TOP_K: ${{ secrets.VECTOR_TOP_K || '20' }}
          BM25_TOP_K: ${{ secrets.BM25_TOP_K || '20' }}
          HYBRID_TOP_K: ${{ secrets.HYBRID_TOP_K || '15' }}
          RERANK_TOP_N: ${{ secrets.RERANK_TOP_N || '5' }}
          MIN_RELEVANCE: ${{ secrets.MIN_RELEVANCE || '0.25' }}
          MAX_CONTEXT_CHARS: ${{ secrets.MAX_CONTEXT_CHARS || '7500' }}

        run: |
          set -euo pipefail

          docker run -d \
            --name saar-enterprise-ai \
            --restart unless-stopped \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_REGION \
            -e AWS_DEFAULT_REGION \
            -e S3_BUCKET \
            -e BEDROCK_EMBED_MODEL \
            -e BEDROCK_CHAT_MODEL \
            -e BEDROCK_RERANK_MODEL \
            -e EMBED_DIM \
            -e PINECONE_API_KEY \
            -e PINECONE_INDEX_NAME \
            -e PINECONE_CLOUD \
            -e PINECONE_REGION \
            -e PINECONE_READY_TIMEOUT \
            -e DATABASE_URL \
            -e AUTH_SECRET_KEY \
            -e AUTH_TOKEN_EXPIRE_HOURS \
            -e HITL_ENABLED \
            -e MEMORY_TURNS \
            -e PARENT_CHUNK_SIZE \
            -e PARENT_CHUNK_OVERLAP \
            -e CHILD_CHUNK_SIZE \
            -e CHILD_CHUNK_OVERLAP \
            -e VECTOR_TOP_K \
            -e BM25_TOP_K \
            -e HYBRID_TOP_K \
            -e RERANK_TOP_N \
            -e MIN_RELEVANCE \
            -e MAX_CONTEXT_CHARS \
            -p 8000:8000 \
            "$IMAGE"

      # ----------------------------------------
      # VERIFY DEPLOYMENT (Liveness + Readiness + Web App)
      # ----------------------------------------

      - name: Verify Deployment
        run: |
          set -euo pipefail

          echo "Waiting for container initialization..."
          sleep 10

          if ! docker inspect \
            -f '{{.State.Running}}' \
            saar-enterprise-ai | grep -qx true; then

            echo "::error::Container is not running"
            docker logs --tail 100 saar-enterprise-ai
            exit 1
          fi

          echo "Verifying Liveness endpoint (/health/live)..."
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            http://127.0.0.1:8000/health/live \
            > /dev/null

          echo "Verifying Readiness & Database connectivity (/health/ready)..."
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            http://127.0.0.1:8000/health/ready \
            > /dev/null

          echo "Verifying Web Interface (/)..."
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            http://127.0.0.1:8000/ \
            > /dev/null

          echo "Saar Enterprise AI deployed and verified successfully"

      # ----------------------------------------
      # CLEANUP
      # ----------------------------------------

      - name: Clean Unused Docker Images
        run: |
          docker image prune -f
